server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20305
  adminConnectors:
    - type: http
      port: 20306
  requestLog:
    appenders:
      - type: file
        archive: false
        timeZone: system
        currentLogFilename: /var/opt/dans.knaw.nl/log/dd-vault-catalog/request.log

database:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/dd_vault_catalog
  user: changeme
  password: changeme
  # N.B. We are logging validation errors, but since connections are validated before being used, automatic recovery
  # should still work, so don't get spooked by the error messages in the log when postgresql is restarted.
  logValidationErrors: true
  validationQuery: "SELECT 1"
  validationQueryTimeout: 3s
  checkConnectionWhileIdle: true
  checkConnectionOnConnect: true
  checkConnectionOnReturn: true
  checkConnectionOnBorrow: true
  evictionInterval: 10s
  minIdleTime: 1 minute
  properties:
    hibernate.dialect: 'org.hibernate.dialect.PostgreSQL95Dialect'
    hibernate.hbm2ddl.auto: update

# Directory where to store the restore SQL scripts for deleted version exports
restoreScriptsDirectory: /var/opt/dans.knaw.nl/tmp/db-backups/vault-catalog-restore-scripts

logging:
  level: INFO
  appenders:
    - archive: false
      currentLogFilename: /var/opt/dans.knaw.nl/log/dd-vault-catalog/dd-vault-catalog.log
      type: file
      timeZone: system
    - type: console
      # Used in combination with journald, which already adds the timestamp
      logFormat: "%-5p %c{0}: %m%n%dwREx"
  loggers:
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'
